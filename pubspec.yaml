name: feedback_hub
description: Offline-first user feedback collection app built with Flutter, BLoC, Firebase and Drift.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  get_it: ^8.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  csv: ^6.0.0
  local_auth: ^2.3.0
  device_info_plus: ^11.1.1
  uuid: ^4.5.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
